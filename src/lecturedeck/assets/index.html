<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Lecturedeck</title>
    <link rel="stylesheet" href="lecturedeck.css">
    <link rel="stylesheet" href="deck.css">
  </head>
  <body>
    <main id="deck" class="deck" aria-live="polite"></main>
    <div id="overview" class="overview" hidden></div>
    <nav id="presentation-controls" class="deck-chrome" aria-label="Presentation controls">
      <button id="controls-toggle" class="controls-toggle" type="button"
              aria-label="Show presentation controls" title="Presentation controls"
              aria-controls="controls-tools" aria-expanded="false">
        <span aria-hidden="true">&#9881;&#65039;</span>
      </button>
      <span id="controls-tools" class="controls-tools" aria-hidden="true" inert>
        <button id="overview-button" type="button" title="Overview (O)">Overview</button>
        <span id="counter" aria-label="Slide number"></span>
        <button id="appearance-button" type="button" aria-haspopup="dialog"
                title="Appearance (T)">Appearance</button>
        <button id="fullscreen-button" type="button" title="Fullscreen (F)">Fullscreen</button>
        <button id="laser-button" type="button" aria-pressed="false"
                title="Laser pointer (L)">Laser</button>
        <a id="deck-selector-link" class="control-link selector-link" href="#deck-selector" hidden
           aria-label="Back to deck selector" title="Deck selector">
          <span aria-hidden="true">&#8962;</span>
        </a>
        <span id="viewer-version" class="viewer-version"></span>
      </span>
    </nav>
    <nav id="touch-nav" class="touch-nav" aria-label="Slide navigation">
      <button id="previous-button" type="button" aria-label="Previous slide" title="Previous slide">‹</button>
      <button id="touch-fullscreen-button" type="button" title="Full screen">Full screen</button>
      <button id="next-button" type="button" aria-label="Next slide" title="Next slide">›</button>
    </nav>
    <dialog id="appearance-dialog" class="appearance-dialog"
            aria-labelledby="appearance-title">
      <form method="dialog">
        <div class="appearance-head">
          <h2 id="appearance-title">Appearance</h2>
          <button id="appearance-close" class="appearance-close" type="submit"
                  aria-label="Close appearance settings">Close</button>
        </div>
        <fieldset>
          <legend>Color mode</legend>
          <label><input type="radio" name="color-mode" value="dark"> Dark</label>
          <label><input type="radio" name="color-mode" value="light"> Light</label>
        </fieldset>
        <fieldset>
          <legend>Presentation style</legend>
          <label><input type="radio" name="presentation-style" value="default">
            Deck default</label>
          <label><input type="radio" name="presentation-style" value="gradient">
            Accent gradient</label>
          <label><input type="radio" name="presentation-style" value="gradient-title-rule">
            Gradient and title rule</label>
        </fieldset>
        <p class="appearance-note">Preferences stay in this browser and do not change deck data.</p>
      </form>
    </dialog>
    <script src="lecturedeck.js"></script>
  </body>
</html>
